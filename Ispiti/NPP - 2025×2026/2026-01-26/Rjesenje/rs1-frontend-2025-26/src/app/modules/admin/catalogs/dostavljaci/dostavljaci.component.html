<div class="container">
  <div class="header-card mat-elevation-z2">
    <div class="header-card-content">
      <h1>Dostavljaci</h1>

      <div class="actions-container">
        <mat-form-field class="search-field" appearance="fill">
          <mat-label>Pretrazi dostavljace...</mat-label>
          <input
            matInput
            (keyup.enter)="request.paging.page = 1; loadPagedData()"
            [(ngModel)]="request.search"
          />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="onCreate()">
          <mat-icon>add</mat-icon>
          Novi dostavljac
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">Dostavljaci se ucitavaju...</div>

  <div *ngIf="!isLoading && errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div class="mat-elevation-z8" *ngIf="!isLoading && !errorMessage">
    <table mat-table [dataSource]="items">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let dostavljac">
          <span style="font-weight: 500">{{ dostavljac.name }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Kod</th>
        <td mat-cell *matCellDef="let dostavljac">
          <span style="font-weight: 500">{{ dostavljac.code }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tip</th>
        <td mat-cell *matCellDef="let dostavljac">
          <span style="font-weight: 500">{{ dostavljac.type }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Aktivan</th>
        <td mat-cell *matCellDef="let dostavljac">
          <mat-icon [ngClass]="dostavljac.isActive ? 'icon-enabled' : 'icon-disabled'">
            {{ dostavljac.isActive ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcije</th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary" (click)="onEdit(product)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(product)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['name', 'code', 'type', 'isActive', 'actions']"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: ['name', 'code', 'type', 'isActive', 'actions']"
      ></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">
          <ng-container *ngIf="request.search; else noDataDefault">
            Nema podataka za filter
          </ng-container>
          <ng-template #noDataDefault> Nema podataka </ng-template>
        </td>
      </tr>
    </table>

    <app-fit-paginator-bar [vm]="this" />
  </div>
</div>
