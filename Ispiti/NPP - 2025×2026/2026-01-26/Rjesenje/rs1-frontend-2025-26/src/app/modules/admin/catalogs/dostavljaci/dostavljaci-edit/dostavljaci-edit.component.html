<div class="container">
  <div class="header-card mat-elevation-z2">
    <h1>Kreiraj Dostavljaca</h1>
  </div>

  <div class="form-card mat-elevation-z2">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!isLoading || form">
      <div *ngIf="errorMessage" class="error-banner">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <div *ngIf="isLoading" class="loading-overlay">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Spremanje...</p>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Naziv</mat-label>
        <input matInput formControlName="name" placeholder="Naziv" />
        <mat-icon matSuffix>inventory_2</mat-icon>
        <mat-error *ngIf="hasError('name')">
          {{ getErrorMessage('name') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Kod</mat-label>
        <input matInput formControlName="code" placeholder="Kod" />
        <mat-icon matSuffix>inventory_2</mat-icon>
        <mat-error *ngIf="hasError('code')">
          {{ getErrorMessage('code') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Tip</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let type of tipovi" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="hasError('type')">
          {{ getErrorMessage('type') }}
        </mat-error>
      </mat-form-field>

      <mat-checkbox formControlName="isActive" color="primary"> Aktivan </mat-checkbox>

      <div class="form-actions">
        <button type="button" mat-stroked-button (click)="onCancel()" [disabled]="isLoading">
          <mat-icon>close</mat-icon>
          Otkazi
        </button>

        <button
          type="submit"
          mat-raised-button
          color="primary"
          [disabled]="form.invalid || isLoading"
        >
          <mat-icon>save</mat-icon>
          Spasi
        </button>
      </div>
    </form>
  </div>
</div>
